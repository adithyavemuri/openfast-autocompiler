# EDIT THIS FILE, not the Python build code.
#
# Quick start:
#   1. Read the [libraries] section and choose a policy.
#   2. Run: python3 build_openfast.py --preflight
#   3. Run: python3 build_openfast.py
#
# Keep comments on their own lines. Do not put quotes around paths.
# Spaces in paths are supported. Use /absolute/paths or ~/paths.
# Relative paths are relative to THIS settings file, not your terminal folder.
# A blank setting uses the environment variable (if documented), then its default.
# A command-line option takes precedence over this file.

[build]
# All downloads and generated files go here, outside this source repository.
# Blank = ../openfast-local, beside the compiler repository.
# Environment fallback: OPENFAST_BUILD_ROOT.
# Example: root = /home/yourname/simulations/openfast-local
root =

# Blank = 4.2.0, the tested and commit-pinned OpenFAST release.
# Environment fallback: OPENFAST_VERSION. Other versions are not validated.
version =

# Number of compilation workers, NOT simulation threads. Blank = 8.
# Environment fallback: JOBS. Reduce this on a machine with little memory.
jobs =

# yes also builds FAST.Farm with OpenMP, in a separate installation folder.
fast_farm = no

# yes allows installing CMake 3.31.6 under <root>/tools if CMake is missing.
# Compilers, Git and Make must already exist; we do not install those.
bootstrap_tools = no

# yes forbids downloads. Required sources and tools must already be cached.
offline = no

[tools]
# Blank = gcc / g++ / gfortran found on PATH (or CC / CXX / FC).
# You can supply an executable name OR the full path to the executable.
# Keep C, C++ and Fortran compilers from a compatible toolchain.
# Example: fortran_compiler = /home/yourname/gcc/bin/gfortran
c_compiler =
cxx_compiler =
fortran_compiler =

# Blank = CMAKE_COMMAND, then cmake on PATH, then <root>/tools/bin/cmake.
# Example: cmake = /home/yourname/tools/bin/cmake
cmake =

[libraries]
# Choose ONE:
#   ask    = show the paths and ask you in the terminal (default).
#   system = use existing libraries, including your own local installation.
#   build  = download and compile private Reference-LAPACK 3.12.1 + BLAS.
# For an IDE or batch job without an interactive terminal, set system or build.
policy = ask

# Used only with policy = system (and inspected during preflight with ask).
# Blank = BLAS_LIBRARY / LAPACK_LIBRARY, then compiler-based auto-detection.
# Supply the actual .so or .a FILE, not its directory. Spaces need no quotes.
# Example of libraries you already installed locally:
#   policy = system
#   blas = /home/yourname/math/lib/libblas.so
#   lapack = /home/yourname/math/lib/liblapack.so
# An OpenBLAS library that provides BOTH APIs can be used in both fields.
# Static libraries must include their required dependencies; the numerical
# check tells you if this two-library setup can link with your toolchain.
blas =
lapack =
